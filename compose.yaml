# Local development only. `docker compose up` serves the app with synthetic traffic on http://localhost:8080.
# Set DEMO_MODE=0 to use the real ADSB.lol feed (see the README for its limits).
name: flights
services:
  flights:
    build: .
    ports:
      - "8080:8000"
    environment:
      DEMO_MODE: "${DEMO_MODE:-1}"
      USER_AGENT_CONTACT: "${USER_AGENT_CONTACT:-https://github.com/MaciejZiel/live_flights_map}"
    volumes:
      - flights-data:/data
volumes:
  flights-data:
