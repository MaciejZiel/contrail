# Server block for contrail.maciejzielinski.dev (reached through the tunnel; no open ports).
# Needs nginx-http.conf included at http level. Build the web app once on deploy:
#   (cd web && npm ci && npm run build)
# and point `root` at web/dist. Replace the include paths with the absolute location of this directory.

server {
    listen 127.0.0.1:8080;
    server_name contrail.maciejzielinski.dev;
    server_tokens off;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # the map worker is an ES module (.mjs); mime.types files that predate it (Termux) would serve it as
    # text/plain and a module worker refuses that. `types` replaces the inherited map, so include it again.
    types {
        include mime.types;
        text/javascript mjs;
    }

    root /data/data/com.termux/files/home/contrail/web/dist;
    index index.html;
    include /data/data/com.termux/files/home/contrail/deploy/termux/nginx-headers.conf;

    # the page must never be served stale: after a rebuild it points at new hashed assets
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /data/data/com.termux/files/home/contrail/deploy/termux/nginx-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed assets and the version-named map worker never change in place
    location ~ ^/(assets|maplibre)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /data/data/com.termux/files/home/contrail/deploy/termux/nginx-headers.conf;
    }
    location /type-photos/ {
        add_header Cache-Control "public, max-age=2592000" always;
        include /data/data/com.termux/files/home/contrail/deploy/termux/nginx-headers.conf;
    }

    # endpoints that can cost an upstream request: a much tighter limit
    location ~ ^/api/v1/(search|airports/[^/]+/weather|aircraft/[^/]+(/route)?)$ {
        limit_req zone=contrail_lookup burst=5 nodelay;
        limit_req zone=contrail_api burst=20 nodelay;
        include /data/data/com.termux/files/home/contrail/deploy/termux/nginx-proxy.conf;
    }

    location /api/ {
        limit_req zone=contrail_api burst=20 nodelay;
        include /data/data/com.termux/files/home/contrail/deploy/termux/nginx-proxy.conf;
    }
}
