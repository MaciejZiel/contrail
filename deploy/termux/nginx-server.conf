# Server block for contrail.maciejzielinski.dev (reached through the tunnel; no open ports).
# Needs nginx-http.conf included at http level. Build the web app once on deploy:
#   (cd web && npm ci && npm run build)
# and point `root` at web/dist. Replace the include paths with the absolute location of this directory.

server {
    listen 127.0.0.1:8080;
    server_name contrail.maciejzielinski.dev;
    server_tokens off;

    limit_req_status 429;  # scoped to this server block on purpose

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # The map worker is an ES module (.mjs). A mime.types that predates it (Termux) would make nginx serve it
    # as text/plain, which a module worker refuses (blank map). A `types` block in a server replaces what it
    # inherits from http, so include the file again and add the mapping next to it.
    include mime.types;
    types {
        text/javascript mjs;
    }

    root /data/data/com.termux/files/home/contrail/web/dist;
    index index.html;
    include /data/data/com.termux/files/home/contrail/deploy/termux/nginx-headers.conf;

    # the page must never be served stale: after a rebuild it points at new hashed assets
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /data/data/com.termux/files/home/contrail/deploy/termux/nginx-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed assets and the version-named map worker never change in place
    location ~ ^/(assets|maplibre)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /data/data/com.termux/files/home/contrail/deploy/termux/nginx-headers.conf;
    }
    # the tab and home-screen icons: a day, so a redesign reaches visitors soon
    location ~ ^/(favicon\.svg|favicon\.ico|favicon-32\.png|apple-touch-icon\.png)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /data/data/com.termux/files/home/contrail/deploy/termux/nginx-headers.conf;
    }
    location /type-photos/ {
        add_header Cache-Control "public, max-age=2592000" always;
        include /data/data/com.termux/files/home/contrail/deploy/termux/nginx-headers.conf;
    }

    # endpoints that can cost an upstream request: a much tighter limit
    location ~ ^/api/v1/(search|airports/[^/]+/weather|aircraft/[^/]+(/route)?)$ {
        limit_req zone=contrail_lookup burst=5 nodelay;
        limit_req zone=contrail_api burst=20 nodelay;
        include /data/data/com.termux/files/home/contrail/deploy/termux/nginx-proxy.conf;
    }

    # in-memory reads that are costly per request (recent tracks for a whole map, type lists): 2 per second
    # per address with a burst of 4 is plenty for a viewer, whose map asks once per move and every 15 s
    location ~ ^/api/v1/(trails|type-hexes|types)$ {
        limit_req zone=contrail_heavy burst=4 nodelay;
        limit_req zone=contrail_api burst=20 nodelay;
        include /data/data/com.termux/files/home/contrail/deploy/termux/nginx-proxy.conf;
    }

    # full scheduler status is for the operator on localhost (the app refuses proxied requests too)
    location /api/v1/internal/ {
        return 404;
    }

    location /api/ {
        limit_req zone=contrail_api burst=20 nodelay;
        include /data/data/com.termux/files/home/contrail/deploy/termux/nginx-proxy.conf;
    }
}
