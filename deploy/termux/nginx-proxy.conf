# Shared by the /api/ locations: proxying, gzip and the 2 second micro-cache.
proxy_pass http://127.0.0.1:8100;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
gzip on;
gzip_types application/octet-stream application/json;
gzip_min_length 500;
# one backend hit per two seconds however many people watch the same area
proxy_cache contrail;
# Only the parameters the API reads, in a fixed order: tracking tags, parameter order or junk
# parameters cannot multiply cache entries (and backend work) for the same answer.
proxy_cache_key "$uri|$arg_x0|$arg_y0|$arg_x1|$arg_y1|$arg_z|$arg_keep|$arg_cs|$arg_ty|$arg_air|$arg_gnd|$arg_alt|$arg_w|$arg_s|$arg_e|$arg_n|$arg_window|$arg_limit|$arg_q|$arg_codes";
proxy_cache_valid 200 2s;
proxy_cache_lock on;
proxy_cache_use_stale updating error timeout;
