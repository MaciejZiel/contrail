# Location snippet: include it inside the server block that is reached through the tunnel.
# Build the web app once: (cd web && npm ci && npm run build) and point `alias` at web/dist.

proxy_cache_path /data/data/com.termux/files/home/flightmap-cache levels=1 keys_zone=flightmap:5m max_size=50m inactive=1m;

location = /flights { return 301 /flights/; }

location /flights/ {
    alias /data/data/com.termux/files/home/live_flights_map/web/dist/;
    try_files $uri $uri/ /index.html;
    # hashed assets never change; the HTML and the type photo manifest may
    location ~* \.(js|css|woff2|json|mjs)$ { expires 7d; add_header Cache-Control "public"; }
    location /flights/type-photos/ { expires 30d; add_header Cache-Control "public"; }
}

location /flights/api/ {
    proxy_pass http://127.0.0.1:8100/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    gzip on;
    gzip_types application/octet-stream application/json;
    gzip_min_length 500;
    # one backend hit per two seconds however many people watch the same area
    proxy_cache flightmap;
    proxy_cache_key "$request_uri";
    proxy_cache_valid 200 2s;
    proxy_cache_lock on;
    proxy_cache_use_stale updating error timeout;
}
