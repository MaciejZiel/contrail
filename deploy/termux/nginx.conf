# Server block for contrail.maciejzielinski.dev (reached through the tunnel; no open ports).
# Build the web app once: (cd web && npm ci && npm run build) and point `root` at web/dist.

proxy_cache_path /data/data/com.termux/files/home/contrail-cache levels=1 keys_zone=contrail:5m max_size=50m inactive=1m;

server {
    listen 127.0.0.1:8080;
    server_name contrail.maciejzielinski.dev;

    root /data/data/com.termux/files/home/contrail/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    # hashed assets never change; the type photos and map worker change rarely
    location ~* \.(js|css|woff2|mjs)$ { expires 7d; add_header Cache-Control "public"; }
    location /type-photos/ { expires 30d; add_header Cache-Control "public"; }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        gzip on;
        gzip_types application/octet-stream application/json;
        gzip_min_length 500;
        # one backend hit per two seconds however many people watch the same area
        proxy_cache contrail;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 2s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
    }
}
