# Include this file at http level (inside `http { ... }`), not inside a server block:
# `proxy_cache_path`, `limit_req_zone` and `map` are http-level directives.

# The client address behind the tunnel: Cloudflare puts it in CF-Connecting-IP (the same key pgqueue uses).
map $http_cf_connecting_ip $contrail_client {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

limit_req_zone $contrail_client zone=contrail_api:10m    rate=10r/s;
limit_req_zone $contrail_client zone=contrail_lookup:10m rate=1r/s;
limit_req_status 429;

proxy_cache_path /data/data/com.termux/files/home/contrail-cache levels=1 keys_zone=contrail:5m max_size=50m inactive=1m;
