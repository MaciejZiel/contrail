# Security headers, repeated in every location that sets its own add_header (nginx drops inherited
# headers there). The CSP must equal CONTENT_SECURITY_POLICY in server/flightmap/app.py; a test checks it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://t.plnspttrs.net; connect-src 'self' https://api.planespotters.net https://tiles.openfreemap.org; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
