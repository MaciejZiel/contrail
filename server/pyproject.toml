[project]
name = "contrail-server"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["starlette==1.7.0", "uvicorn==0.54.0"]

[tool.setuptools.package-data]
flightmap = ["data/*.json", "data/*.tsv"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101", "S311", "S324", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S310"]
# starts the local interpreter and two local tools on purpose
"scripts/simulate_freshness.py" = ["S310", "S603", "S607"]

[tool.pyright]
include = ["flightmap", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
